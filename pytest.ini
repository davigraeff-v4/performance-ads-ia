[pytest]
# `pytest` na raiz roda o motor (tests/) e o GTM. O conector Google Ads estendido
# roda no próprio runtime (pipx) via scripts/validate_all.py, porque depende da
# versão de fastmcp instalada lá.
testpaths = tests integrations/gtm/tests
pythonpath = . integrations/gtm/src
addopts = --import-mode=importlib -q
filterwarnings =
    ignore::DeprecationWarning
