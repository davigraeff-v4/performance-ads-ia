[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "performance-ads-gtm"
version = "0.1.0"
description = "Local, fail-closed Google Tag Manager API client for PERFORMANCE ADS IA"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/performance_ads_gtm"]
